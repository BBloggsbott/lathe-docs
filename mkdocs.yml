site_name: Lathe
theme:
  name: material
  palette:
     - scheme: default
       toggle:
         icon: material/brightness-7
         name: Switch to dark mode
     - scheme: slate
       toggle:
         icon: material/brightness-4
         name: Switch to light mode
  features:
      - navigation.tabs
      - navigation.sections
      - content.code.copy
      - search.suggest
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - mike
